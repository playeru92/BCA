<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Study Lite</title>
    <!-- Imports Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Imports the Inter font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Uses the Inter font as the default */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Disables tap highlight on mobile */
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- This container simulates the phone screen. -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col">

        <!-- Header Bar -->
        <header class="bg-blue-600 text-white p-5 shadow-md rounded-b-lg">
            <h1 class="text-2xl font-bold text-center">BCA Study Lite</h1>
            <p class="text-center text-sm text-blue-100">MJP Rohilkhand University - Year 1</p>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow p-4 sm:p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">First Year Subjects</h2>
            
            <!-- List of Subjects -->
            <div class="space-y-3">

                <!-- 
                  NOTE TO USER: 
                  You must replace the 'href' attribute in each link (<a> tag) 
                  with the actual URL of your PDF file for that subject.
                  I am using a placeholder PDF for this demo.
                -->

                <!-- Subject 1: Fundamental of Computer Science -->
                <a href="https://raw.githubusercontent.com/playeru92/BCA/main/Computer%20Fundamentals%20and%20PC%20Software.pdf" target="_blank" class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:bg-gray-50 active:bg-blue-50 transition-all duration-200 ease-in-out">
                    <span class="text-base font-medium text-gray-800">Fundamental of Computer Science</span>
                    <!-- Icon: Chevron Right -->
                    <svg class="w-5 h-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </a>

                <!-- Subject 2: C Language -->
                <a href="https://raw.githubusercontent.com/playeru92/BCA/main/Programming%20with%20C.pdf" target="_blank" class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:bg-gray-50 active:bg-blue-50 transition-all duration-200 ease-in-out">
                    <span class="text-base font-medium text-gray-800">C Language</span>
                    <svg class="w-5 h-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </a>

                <!-- Subject 3: Mathematics -->
                <a href="https://raw.githubusercontent.com/playeru92/BCA/main/basic%20Mathematics.pdf" target="_blank" class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:bg-gray-50 active:bg-blue-50 transition-all duration-200 ease-in-out">
                    <span class="text-base font-medium text-gray-800">Mathematics</span>
                    <svg class="w-5 h-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </a>

                <!-- Subject 4: Communicative English -->
                <a href="https://raw.githubusercontent.com/playeru92/BCA/main/Communicative%20English.pdf" target="_blank" class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:bg-gray-50 active:bg-blue-50 transition-all duration-200 ease-in-out">
                    <span class="text-base font-medium text-gray-800">Communicative English</span>
                    <svg class="w-5 h-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </a>

                <!-- Subject 5: Management -->
                <a href="https://raw.githubusercontent.com/playeru92/BCA/main/Fundamentals-of-Management.pdf" target="_blank" class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:bg-gray-50 active:bg-blue-50 transition-all duration-200 ease-in-out">
                    <span class="text-base font-medium text-gray-800">Management</span>
                    <svg class="w-5 h-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </a>

            </div>
        </main>

        <!-- Footer -->
        <footer class="p-4">
            <p class="text-center text-xs text-gray-400">
                Created for BCA Students
            </p>
        </footer>
    </div>

</body>

</html>
